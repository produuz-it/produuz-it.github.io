V6Q15 4.73 14.13 3.87Q13.27 3 12 3Z" fill="#1976D2"/><rect x="108.8" y="293.0" width="302.4" height="11.0" rx="2" fill="#d5d5d5"/><circle cx="488.0" cy="259.0" r="14" fill="#ffffff"/><circle cx="488.0" cy="259.0" r="12" fill="#7c3aed"/><text x="488.0" y="263.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="44.5" y="332.5" width="431.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="52.0" y="330.0" width="78.2" height="5.0" fill="#ffffff"/><text x="56.0" y="336.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Strapped rows</text><text x="56.0" y="359.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">A0 and B0</text><path transform="translate(444.0,342.0) scale(1.0000)" d="M6.98 9.98 12 15 17.02 9.98Z" fill="#616161"/><text x="56.0" y="390.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">The rows tied to the frame. They are loaded first and come off last.</text><circle cx="488.0" cy="354.0" r="14" fill="#ffffff"/><circle cx="488.0" cy="354.0" r="12" fill="#7c3aed"/><text x="488.0" y="358.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">3</text><rect x="44.5" y="412.5" width="431.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="52.0" y="410.0" width="74.5" height="5.0" fill="#ffffff"/><text x="56.0" y="416.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Usable length</text><text x="56.0" y="439.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">8000</text><text x="436.0" y="439.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#616161">mm</text><rect x="44.5" y="476.5" width="431.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="52.0" y="474.0" width="107.0" height="5.0" fill="#ffffff"/><text x="56.0" y="480.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Stack depth per side</text><text x="56.0" y="503.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">600</text><text x="436.0" y="503.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#616161">mm</text><rect x="44.5" y="540.5" width="431.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="52.0" y="538.0" width="90.8" height="5.0" fill="#ffffff"/><text x="56.0" y="544.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Max panel height</text><text x="56.0" y="567.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">3200</text><text x="436.0" y="567.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#616161">mm</text><rect x="44.5" y="604.5" width="431.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="52.0" y="602.0" width="116.8" height="5.0" fill="#ffffff"/><text x="56.0" y="608.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Max overhang per end</text><text x="56.0" y="631.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">300</text><text x="436.0" y="631.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#616161">mm</text><text x="44.0" y="674.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Rows sit centred on the rack. This is how far one may stick</text><text x="44.0" y="688.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">out past each end.</text><circle cx="488.0" cy="626.0" r="14" fill="#ffffff"/><circle cx="488.0" cy="626.0" r="12" fill="#7c3aed"/><text x="488.0" y="630.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="44.0" y="720.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">Soft limits. The editor warns when a load goes over them</text><text x="44.0" y="736.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">and lets you carry on.</text><rect x="386.0" y="756.0" width="90.0" height="36.0" rx="4" fill="#4CAF50"/><text x="411.8" y="778.7" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="700" letter-spacing="0.9">SAVE</text><text x="301.7" y="778.7" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#616161" font-weight="700" letter-spacing="0.9">CLOSE</text></svg>
