<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="Left, a building with one wall panel highlighted, in project coordinates with Z up. Right, the same panel lying flat with its own X and Y axes and Z towards the viewer. An arrow labelled placement links the two."><rect x="0" y="0" width="900" height="370" fill="#ffffff"/>
  <g font-family="Roboto, Arial, Helvetica, sans-serif" fill="#231F20" font-size="13">
    <text x="215" y="30" text-anchor="middle" font-weight="800" fill="#5c257b">Design · where the panel goes</text>
    <text x="690" y="30" text-anchor="middle" font-weight="800" fill="#ea590c">Fabrication · what is built</text>
    <!-- building -->
    <polygon points="80,120 150,70 370,70 300,120" fill="#f7f4f8" stroke="#5b5560"/>
    <polygon points="300,120 370,70 370,250 300,300" fill="#ece7ef" stroke="#5b5560"/>
    <rect x="80" y="120" width="220" height="180" fill="#fff" stroke="#5b5560"/>
    <line x1="80" y1="210" x2="300" y2="210" stroke="#e4dfe6"/>
    <rect x="130" y="210" width="110" height="90" fill="#f07e00" opacity=".85" stroke="#ea590c"/>
    <rect x="160" y="230" width="34" height="40" fill="#fff" stroke="#ea590c"/>
    <text x="185" y="198" text-anchor="middle" fill="#5b5560" font-size="12">storey 0 · south facade</text>
    <!-- world triad -->
    <line x1="30" y1="340" x2="30" y2="296" stroke="#231F20" stroke-width="1.5"/><path d="M30 288 L25 299 L35 299 Z" fill="#231F20"/>
    <line x1="30" y1="340" x2="70" y2="340" stroke="#231F20" stroke-width="1.5"/><path d="M78 340 L67 335 L67 345 Z" fill="#231F20"/>
    <line x1="30" y1="340" x2="52" y2="324" stroke="#231F20" stroke-width="1.5"/><path d="M58 320 L46 322 L52 330 Z" fill="#231F20"/>
    <text x="30" y="282" text-anchor="middle" font-family="'Roboto Mono', Consolas, monospace" font-size="12">Z</text>
    <text x="84" y="344" font-family="'Roboto Mono', Consolas, monospace" font-size="12">X</text>
    <text x="62" y="318" font-family="'Roboto Mono', Consolas, monospace" font-size="12">Y</text>
    <text x="100" y="344" fill="#5b5560" font-size="12">project coordinates, mm, Z up</text>
    <!-- placement arrow -->
    <path d="M244 240 C 380 240, 420 100, 520 100" fill="none" stroke="#5c257b" stroke-width="2.5"/>
    <path d="M532 100 L519 94 L519 106 Z" fill="#5c257b"/>
    <text x="448" y="80" text-anchor="middle" font-weight="800" fill="#5c257b">placement</text>
    <text x="448" y="62" text-anchor="middle" fill="#5b5560" font-size="12">rotation + translation</text>
    <!-- flat panel -->
    <rect x="540" y="110" width="300" height="150" fill="#f3e3c3" stroke="#8d6e3f"/>
    <rect x="540" y="110" width="300" height="12" fill="#e6cfa0" stroke="#8d6e3f"/>
    <rect x="540" y="248" width="300" height="12" fill="#e6cfa0" stroke="#8d6e3f"/>
    <rect x="540" y="122" width="12" height="126" fill="#e6cfa0" stroke="#8d6e3f"/>
    <rect x="616" y="122" width="12" height="126" fill="#e6cfa0" stroke="#8d6e3f"/>
    <rect x="712" y="122" width="12" height="126" fill="#e6cfa0" stroke="#8d6e3f"/>
    <rect x="828" y="122" width="12" height="126" fill="#e6cfa0" stroke="#8d6e3f"/>
    <rect x="628" y="150" width="84" height="80" fill="#fff" stroke="#8d6e3f"/>
    <circle cx="540" cy="260" r="7" fill="#ea590c" stroke="#fff" stroke-width="2"/>
    <line x1="540" y1="286" x2="650" y2="286" stroke="#ea590c" stroke-width="2.5"/><path d="M662 286 L650 280 L650 292 Z" fill="#ea590c"/>
    <text x="670" y="291" font-family="'Roboto Mono', Consolas, monospace" font-weight="500" fill="#ea590c">X</text>
    <line x1="516" y1="260" x2="516" y2="160" stroke="#ea590c" stroke-width="2.5"/><path d="M516 148 L510 160 L522 160 Z" fill="#ea590c"/>
    <text x="516" y="140" text-anchor="middle" font-family="'Roboto Mono', Consolas, monospace" font-weight="500" fill="#ea590c">Y</text>
    <circle cx="516" cy="286" r="8" fill="none" stroke="#ea590c" stroke-width="2"/><circle cx="516" cy="286" r="2.5" fill="#ea590c"/>
    <text x="500" y="310" fill="#ea590c" font-size="12"><tspan font-family="'Roboto Mono', Consolas, monospace">Z</tspan> towards you = the front</text>
    <text x="690" y="336" text-anchor="middle" fill="#5b5560" font-size="12">panel frame: flat, the same wherever the panel goes</text>
  </g>
</svg>