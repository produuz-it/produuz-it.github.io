"/><circle cx="290.0" cy="83.0" r="12" fill="#7c3aed"/><text x="290.0" y="87.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">1</text><path transform="translate(368.0,75.5) scale(0.6250)" d="M8.02 12.98Q6.61 12.98 5.55 13.83Q4.5 14.67 4.12 15.98H2.02V18H4.12Q4.5 19.31 5.55 20.16Q6.61 21 7.99 21Q9.38 21 10.45 20.16Q11.53 19.31 11.86 18H21.98V15.98H11.86Q11.53 14.67 10.45 13.83Q9.38 12.98 8.02 12.98ZM8.02 18.98Q7.17 18.98 6.59 18.4Q6 17.81 6 16.99Q6 16.17 6.59 15.59Q7.17 15 7.99 15Q8.81 15 9.4 15.59Q9.98 16.17 9.98 16.99Q9.98 17.81 9.4 18.4Q8.81 18.98 8.02 18.98ZM19.88 6Q19.5 4.69 18.45 3.84Q17.39 3 16.01 3Q14.62 3 13.55 3.84Q12.47 4.69 12.14 6H2.02V8.02H12.14Q12.47 9.33 13.55 10.17Q14.62 11.02 16.01 11.02Q17.39 11.02 18.45 10.17Q19.5 9.33 19.88 8.02H21.98V6ZM15.98 9Q15.19 9 14.6 8.41Q14.02 7.83 14.02 7.01Q14.02 6.19 14.6 5.6Q15.19 5.02 16.01 5.02Q16.83 5.02 17.41 5.6Q18 6.19 18 7.01Q18 7.83 17.41 8.41Q16.83 9 15.98 9Z" fill="#1976D2"/><text x="389.0" y="87.3" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#1976D2" font-weight="700" letter-spacing="0.9">BEHAVIOURS</text><path transform="translate(530.0,72.0) scale(0.9167)" d="M6 18.98Q6 19.83 6.59 20.41Q7.17 21 8.02 21H15.98Q16.83 21 17.41 20.41Q18 19.83 18 18.98V6.98H6ZM8.02 9H15.98V18.98H8.02ZM15.52 3.98 14.48 3H9.52L8.48 3.98H5.02V6H18.98V3.98Z" fill="#616161"/><circle cx="350.0" cy="83.0" r="14" fill="#ffffff"/><circle cx="350.0" cy="83.0" r="12" fill="#7c3aed"/><text x="350.0" y="87.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="32.0" y="124.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">Name</text><rect x="32.5" y="132.5" width="159.0" height="39.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="40.0" y="130.0" width="65.8" height="5.0" fill="#ffffff"/><text x="44.0" y="136.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Class name</text><text x="44.0" y="156.7" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#212121">Placeholder</text><text x="212.0" y="124.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">Entries</text><path transform="translate(478.0,115.0) scale(0.5833)" d="M18.98 12.98H12.98V18.98H11.02V12.98H5.02V11.02H11.02V5.02H12.98V11.02H18.98Z" fill="#ea590c"/><text x="498.0" y="126.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#ea590c" font-weight="700" letter-spacing="0.9">ADD ITEM</text><rect x="212.5" y="132.5" width="107.0" height="39.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="220.0" y="130.0" width="51.8" height="5.0" fill="#ffffff"/><text x="224.0" y="136.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">IFC Prop</text><text x="224.0" y="156.3" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#212121">name</text><path transform="translate(288.0,140.0) scale(1.0000)" d="M6.98 9.98 12 15 17.02 9.98Z" fill="#616161"/><rect x="326.5" y="132.5" width="107.0" height="39.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="334.0" y="130.0" width="77.0" height="5.0" fill="#ffffff"/><text x="338.0" y="136.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Type of match</text><text x="338.0" y="156.3" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#212121">Contains</text><path transform="translate(402.0,140.0) scale(1.0000)" d="M6.98 9.98 12 15 17.02 9.98Z" fill="#616161"/><rect x="440.5" y="132.5" width="99.0" height="39.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="448.0" y="130.0" width="35.7" height="5.0" fill="#ffffff"/><text x="452.0" y="136.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Value</text><text x="452.0" y="156.3" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#212121">ISOLA…</text><path transform="translate(540.0,142.0) scale(0.8333)" d="M6 18.98Q6 19.83 6.59 20.41Q7.17 21 8.02 21H15.98Q16.83 21 17.41 20.41Q18 19.83 18 18.98V6.98H6ZM8.02 9H15.98V18.98H8.02ZM15.52 3.98 14.48 3H9.52L8.48 3.98H5.02V6H18.98V3.98Z" fill="#616161"/><text x="32.0" y="206.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">A part gets its name from the first class that matches;</text><text x="32.0" y="224.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">its behaviours are added up from every class it matches.</text><rect x="602.0" y="22.0" width="544.0" height="528.0" rx="8" fill="#000" opacity="0.14"/><rect x="600.0" y="16.0" width="544.0" height="528.0" rx="8" fill="#ffffff"/><text x="624.0" y="54.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="18" fill="#212121" font-weight="500">Behaviours — Placeholder</text><text x="624.0" y="72.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">What parts of this class are left out of. Everything is off by default,</text><text x="624.0" y="88.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">and off means the part counts in every measurement.</text><text x="624.0" y="124.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161" font-weight="700" letter-spacing="1">WHOLE PART</text><rect x="624.0" y="140.0" width="36.0" height="14.0" rx="7" fill="#bdbdbd" opacity="1"/><circle cx="633.0" cy="147.0" r="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/><text x="672.0" y="152.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">Ignore this part completely</text><text x="672.0" y="170.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">It never reaches the parts list, the reports or the machine files.</text><rect x="624.0" y="194.0" width="36.0" height="14.0" rx="7" fill="#bdbdbd" opacity="1"/><circle cx="633.0" cy="201.0" r="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/><text x="672.0" y="206.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">Hide in the 3D viewer</text><text x="672.0" y="224.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">It is still measured and still produced, it is only not drawn.</text><text x="624.0" y="262.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161" font-weight="700" letter-spacing="1">SURFACE</text><rect x="624.0" y="278.0" width="36.0" height="14.0" rx="7" fill="#1976D2" opacity="0.5"/><circle cx="651.0" cy="285.0" r="10" fill="#1976D2"/><text x="672.0" y="290.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">Ignore in surface</text><text x="672.0" y="308.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">The net, gross and opening areas of the panel.</text><text x="624.0" y="346.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161" font-weight="700" letter-spacing="1">DIMENSIONS</text><rect x="624.0" y="362.0" width="36.0" height="14.0" rx="7" fill="#1976D2" opacity="0.5"/><circle cx="651.0" cy="369.0" r="10" fill="#1976D2"/><text x="672.0" y="374.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">Ignore in width (X)</text><rect x="624.0" y="400.0" width="36.0" height="14.0" rx="7" fill="#1976D2" opacity="0.5"/><circle cx="651.0" cy="407.0" r="10" fill="#1976D2"/><text x="672.0" y="412.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">Ignore in height (Y)</text><rect x="624.0" y="438.0" width="36.0" height="14.0" rx="7" fill="#bdbdbd" opacity="1"/><circle cx="633.0" cy="445.0" r="10" fill="#fafafa" stroke="#bdbdbd" stroke-width="1"/><text x="672.0" y="450.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">Ignore in thickness (Z)</text><text x="672.0" y="468.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Leave this off for a placeholder layer: it is what sets the thickness of the panel.</text><circle cx="1120.0" cy="260.0" r="14" fill="#ffffff"/><circle cx="1120.0" cy="260.0" r="12" fill="#7c3aed"/><text x="1120.0" y="264.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">3</text><circle cx="1120.0" cy="420.0" r="14" fill="#ffffff"/><circle cx="1120.0" cy="420.0" r="12" fill="#7c3aed"/><text x="1120.0" y="424.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">4</text><text x="1055.7" y="522.7" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#616161" font-weight="700" letter-spacing="0.9">CLOSE</text></svg>
