<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700" role="img" aria-label="The action trigger form."><rect x="0.0" y="0.0" width="820.0" height="700.0" fill="#f6f6f6"/><rect x="18.0" y="22.0" width="788.0" height="668.0" rx="8" fill="#000" opacity="0.14"/><rect x="16.0" y="16.0" width="788.0" height="668.0" rx="8" fill="#ffffff"/><path transform="translate(40.0,36.0) scale(1.0000)" d="M6.98 2.02H17.02L13.5 9H17.02L9.98 21.98V14.02H6.98ZM9 3.98V12H12V14.67L14.02 11.02H10.22L13.78 3.98Z" fill="#212121"/><text x="72.0" y="55.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="20" fill="#212121" font-weight="500">Action trigger</text><text x="40.0" y="82.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#616161">Run something on its own when an event happens in production, with nobody clicking anything.</text><path transform="translate(40.0,104.0) scale(0.7500)" d="M21.42 11.58 12.42 2.58Q11.81 2.02 11.02 2.02H3.98Q3.19 2.02 2.6 2.6Q2.02 3.19 2.02 3.98V11.02Q2.02 11.81 2.58 12.42L11.58 21.42Q12.19 21.98 13.01 21.98Q13.83 21.98 14.39 21.42L21.42 14.39Q21.98 13.83 21.98 13.01Q21.98 12.19 21.42 11.58ZM12.98 20.02 3.98 11.02V3.98H11.02L20.02 12.98ZM6.52 5.02Q7.12 5.02 7.57 5.44Q8.02 5.86 8.02 6.49Q8.02 7.12 7.57 7.57Q7.12 8.02 6.49 8.02Q5.86 8.02 5.44 7.57Q5.02 7.12 5.02 6.49Q5.02 5.86 5.44 5.44Q5.86 5.02 6.52 5.02Z" fill="#616161"/><text x="64.0" y="118.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121" font-weight="600">Identification</text><rect x="40.5" y="132.5" width="739.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="48.0" y="130.0" width="37.2" height="5.0" fill="#ffffff"/><text x="52.0" y="136.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Name</text><text x="52.0" y="159.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">Auto drawings walls</text><circle cx="52.0" cy="208.0" r="12" fill="#ea590c"/><text x="52.0" y="212.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="74.0" y="213.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#212121" font-weight="700">When this happens</text><text x="74.0" y="232.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">The event that starts the automation.</text><rect x="74.5" y="248.5" width="705.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="82.0" y="246.0" width="35.8" height="5.0" fill="#ffffff"/><text x="86.0" y="252.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Event</text><text x="86.0" y="275.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">A design finishes its analysis</text><path transform="translate(748.0,258.0) scale(1.0000)" d="M6.98 9.98 12 15 17.02 9.98Z" fill="#616161"/><circle cx="52.0" cy="332.0" r="12" fill="#ea590c"/><text x="52.0" y="336.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="74.0" y="337.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#212121" font-weight="700">Only if</text><text x="74.0" y="356.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">Narrows it down to some designs. Leave it empty to apply it to every design.</text><rect x="74.5" y="372.5" width="229.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="82.0" y="370.0" width="65.0" height="5.0" fill="#ffffff"/><text x="86.0" y="376.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Design field</text><text x="86.0" y="399.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">tipo</text><path transform="translate(272.0,382.0) scale(1.0000)" d="M6.98 9.98 12 15 17.02 9.98Z" fill="#616161"/><text x="86.0" y="430.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">name or tipo, or any key of the design&#x27;s client data.</text><rect x="314.5" y="372.5" width="229.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="322.0" y="370.0" width="77.0" height="5.0" fill="#ffffff"/><text x="326.0" y="376.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Type of match</text><text x="326.0" y="399.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">Match prefix</text><path transform="translate(512.0,382.0) scale(1.0000)" d="M6.98 9.98 12 15 17.02 9.98Z" fill="#616161"/><rect x="554.5" y="372.5" width="225.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="562.0" y="370.0" width="35.7" height="5.0" fill="#ffffff"/><text x="566.0" y="376.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Value</text><text x="566.0" y="399.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">W</text><circle cx="792.0" cy="394.0" r="14" fill="#ffffff"/><circle cx="792.0" cy="394.0" r="12" fill="#7c3aed"/><text x="792.0" y="398.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">1</text><circle cx="52.0" cy="468.0" r="12" fill="#ea590c"/><text x="52.0" y="472.5" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="74.0" y="473.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#212121" font-weight="700">Then do this</text><text x="74.0" y="492.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">What runs each time the event happens.</text><rect x="74.5" y="508.5" width="705.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="82.0" y="506.0" width="38.2" height="5.0" fill="#ffffff"/><text x="86.0" y="512.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Action</text><text x="86.0" y="535.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">Generate the drawings of the design</text><path transform="translate(748.0,518.0) scale(1.0000)" d="M6.98 9.98 12 15 17.02 9.98Z" fill="#616161"/><rect x="74.5" y="568.5" width="705.0" height="43.0" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1"/><rect x="82.0" y="566.0" width="77.8" height="5.0" fill="#ffffff"/><text x="86.0" y="572.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="11" fill="#616161">Drawing setup</text><text x="86.0" y="595.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#212121">Front+zones</text><path transform="translate(748.0,578.0) scale(1.0000)" d="M6.98 9.98 12 15 17.02 9.98Z" fill="#616161"/><circle cx="792.0" cy="590.0" r="14" fill="#ffffff"/><circle cx="792.0" cy="590.0" r="12" fill="#7c3aed"/><text x="792.0" y="594.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">2</text><rect x="703.4" y="640.0" width="76.6" height="36.0" rx="4" fill="#242021"/><text x="717.4" y="662.7" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="700" letter-spacing="0.9">CLOSE</text><rect x="583.4" y="640.0" width="110.0" height="36.0" rx="4" fill="#1976D2"/><path transform="translate(607.2,649.0) scale(0.7500)" d="M21 6.98 9 18.98 3.52 13.5 4.92 12.09 9 16.17 19.59 5.58Z" fill="#ffffff"/><text x="631.2" y="662.7" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" font-weight="700" letter-spacing="0.9">SAVE</text></svg>
