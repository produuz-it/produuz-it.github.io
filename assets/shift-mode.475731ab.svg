<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="The shift: how the panel lies against the stops of the table."><rect x="0.0" y="0.0" width="900.0" height="480.0" fill="#ffffff"/><text x="40.0" y="34.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" fill="#616161" font-weight="700">Seen from above, panel on the table</text><rect x="94.0" y="80.0" width="18.0" height="250.0" rx="2" fill="#242021"/><rect x="110.0" y="334.0" width="640.0" height="18.0" rx="2" fill="#242021"/><text x="86.0" y="200.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#242021" font-weight="700" text-anchor="end">stop X</text><text x="450.0" y="380.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#242021" font-weight="700" text-anchor="middle">stop Y</text><rect x="112.0" y="90.0" width="600.0" height="236.0" fill="#cfe0f5" stroke="#7a95b8" stroke-width="1" opacity="0.6"/><rect x="158.0" y="102.0" width="40.0" height="212.0" fill="#f3e3c3" stroke="#8d6e3f" stroke-width="1"/><rect x="278.0" y="102.0" width="40.0" height="212.0" fill="#f3e3c3" stroke="#8d6e3f" stroke-width="1"/><rect x="398.0" y="102.0" width="40.0" height="212.0" fill="#f3e3c3" stroke="#8d6e3f" stroke-width="1"/><rect x="518.0" y="102.0" width="40.0" height="212.0" fill="#f3e3c3" stroke="#8d6e3f" stroke-width="1"/><rect x="638.0" y="102.0" width="40.0" height="212.0" fill="#f3e3c3" stroke="#8d6e3f" stroke-width="1"/><rect x="158.0" y="274.0" width="520.0" height="40.0" fill="#e6cfa0" stroke="#8d6e3f" stroke-width="1"/><rect x="158.0" y="102.0" width="520.0" height="40.0" fill="#e6cfa0" stroke="#8d6e3f" stroke-width="1"/><line x1="112.0" y1="66.0" x2="112.0" y2="96.0" stroke="#7c3aed" stroke-width="1.5"/><line x1="158.0" y1="66.0" x2="158.0" y2="96.0" stroke="#7c3aed" stroke-width="1.5"/><line x1="116.0" y1="74.0" x2="150.0" y2="74.0" stroke="#7c3aed" stroke-width="2"/><path d="M156.0 74.0 L147.0 69.0 L147.0 79.0 Z" fill="#7c3aed"/><text x="172.0" y="78.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#7c3aed" font-weight="600">X in: distance from the stop to the first stud</text><circle cx="135.0" cy="50.0" r="14" fill="#ffffff"/><circle cx="135.0" cy="50.0" r="12" fill="#7c3aed"/><text x="135.0" y="54.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="412.0" y="218.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#4a6a92" text-anchor="middle">plate of zone -1 overhangs the frame</text><text x="60.0" y="410.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#212121" font-weight="700">No shift</text><text x="210.0" y="410.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">coordinates as in the model, nothing added</text><text x="60.0" y="432.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#212121" font-weight="700">Shift on layers</text><text x="210.0" y="432.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">the shift is written once on each Layer row</text><text x="60.0" y="454.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="13" fill="#212121" font-weight="700">Shift on operations</text><text x="210.0" y="454.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12" fill="#616161">the shift is added to every command of the plate layers</text><circle cx="38.0" cy="405.0" r="14" fill="#ffffff"/><circle cx="38.0" cy="405.0" r="12" fill="#7c3aed"/><text x="38.0" y="409.6" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="12.600000000000001" fill="#fff" font-weight="700" text-anchor="middle">2</text></svg>
